[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpool"
version = "0.1.0"
description = "Python SDK for Agent Pool — autonomous M2M economic coordination layer"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Agent Pool", email = "system@agentpool.ai"}
]
keywords = ["agent", "ai", "m2m", "autonomous", "economy", "a2a", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP"
]
requires-python = ">=3.9"

dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
crypto = [
    "cryptography>=42.0.0",
]
all = [
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/CalugherLeonid/agentpool-sdk"
Repository = "https://github.com/CalugherLeonid/agentpool-sdk"
"Pool URL" = "https://agent-pool-gateway-production.up.railway.app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentpool*"]
